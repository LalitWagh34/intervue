name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db db:generate
      - run: bun run db:validate
      - run: bun run test:server
        env:
          NODE_ENV: test
      - run: bun run test:web
      - run: bun run typecheck
